name: Prepare Turkey property images
on:
  push:
    branches: [media/turkey-gallery-20260913]
    paths:
      - 'tools/prepare_turkey_gallery.py'
      - '.github/workflows/prepare-turkey-gallery.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'yt-dlp[default]' Pillow
      - name: Extract original-resolution candidate frames
        run: python tools/prepare_turkey_gallery.py
      - name: Save extracted images on the media branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .media-review/turkey
          git commit -m 'Save video frames for Turkey gallery review'
          git push origin HEAD:media/turkey-gallery-20260913
