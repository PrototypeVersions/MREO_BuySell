name: Capture Turkey property images
on:
  push:
    branches: [media/turkey-gallery-20260913]
    paths:
      - 'tools/capture_turkey_gallery.mjs'
      - 'tools/turkey_contact_sheet.py'
      - '.github/workflows/prepare-turkey-gallery.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check Pillow
      - name: Capture frames through normal video playback
        run: |
          node tools/capture_turkey_gallery.mjs
          python tools/turkey_contact_sheet.py
      - name: Save extracted images on the media branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .media-review/turkey
          git commit -m 'Save browser-captured video frames for Turkey gallery review'
          git push origin HEAD:media/turkey-gallery-20260913
