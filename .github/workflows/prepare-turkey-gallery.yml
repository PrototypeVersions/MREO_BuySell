name: Collect public Turkey video previews
on:
  push:
    branches: [media/turkey-gallery-20260913]
    paths:
      - 'tools/collect_turkey_previews.py'
      - '.github/workflows/prepare-turkey-gallery.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Collect public video preview images
        run: python tools/collect_turkey_previews.py
      - name: Save images for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .media-review/turkey
          git commit -m 'Save highest-resolution public Turkey video previews'
          git push origin HEAD:media/turkey-gallery-20260913
