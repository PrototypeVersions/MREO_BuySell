name: Prepare new Turkey cover photo
on:
  push:
    branches: [media/turkey-cover-14441]
    paths:
      - 'tools/prepare_turkey_cover_14441.py'
      - '.github/workflows/prepare-turkey-cover-14441.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare the uploaded cover photo
        run: python tools/prepare_turkey_cover_14441.py
      - name: Save the web image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/turkey/photos/videoframe_14441.webp .media-review/turkey-cover-14441
          git commit -m 'Prepare the new Turkey cover photo'
          git push origin HEAD:media/turkey-cover-14441
